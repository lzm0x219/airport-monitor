name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_SIGNING_MODE: ${{ vars.AIRPORT_RELEASE_SIGNING || 'adhoc' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Prepare release notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tools/release/prepare-notes.sh "$RELEASE_TAG" docs/releases \
            "$RUNNER_TEMP/airport-monitor-release/release-notes.md"

      - name: Run tests
        run: swift test --scratch-path "$RUNNER_TEMP/airport-monitor-tests" --skip RequestGateConcurrencyTests

      - name: Run request gate tests
        run: swift test --scratch-path "$RUNNER_TEMP/airport-monitor-tests" --skip-build --no-parallel --filter RequestGateConcurrencyTests

      - name: Prepare isolated update test key
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: |
          umask 077
          openssl rand -base64 32 > "$RUNNER_TEMP/airport-monitor-test-update-key"
          public_key=$(swift tools/release/update-public-key.swift < "$RUNNER_TEMP/airport-monitor-test-update-key")
          echo "AIRPORT_TEST_PUBLIC_KEY=$public_key" >> "$GITHUB_ENV"

      - name: Validate release signing mode
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          case "$RELEASE_SIGNING_MODE" in
            adhoc|developer-id) ;;
            *) echo 'Invalid AIRPORT_RELEASE_SIGNING repository variable.' >&2; exit 1 ;;
          esac

      - name: Configure Developer ID signing
        if: github.event_name == 'push' && github.ref_type == 'tag' && env.RELEASE_SIGNING_MODE == 'developer-id'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: tools/release/setup-signing.sh

      - name: Build universal app
        env:
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          options=('AIRPORT_RELEASE_SIGNING=adhoc' 'CODE_SIGN_IDENTITY=-' 'CODE_SIGN_ENTITLEMENTS=AirportMonitor.AdHoc.entitlements')
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag && "$RELEASE_SIGNING_MODE" == developer-id ]]; then
            options=('AIRPORT_RELEASE_SIGNING=developer-id' "CODE_SIGN_IDENTITY=$AIRPORT_SIGNING_IDENTITY" \
              'CODE_SIGN_ENTITLEMENTS=AirportMonitor.entitlements' "OTHER_CODE_SIGN_FLAGS=--keychain $AIRPORT_SIGNING_KEYCHAIN")
          elif [[ "$EVENT_NAME" != push || "$REF_TYPE" != tag ]]; then
            options+=("SPARKLE_PUBLIC_KEY=$AIRPORT_TEST_PUBLIC_KEY")
          fi
          xcodebuild -project AirportMonitor.xcodeproj -scheme AirportMonitor -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/airport-monitor-build" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/airport-monitor-packages" \
            CODE_SIGN_STYLE=Manual "${options[@]}" 'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO build

      - name: Verify update continuity
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: tools/release/verify-previous-release.sh "$RELEASE_TAG" "$RUNNER_TEMP/airport-monitor-packages/artifacts/sparkle/Sparkle/bin"

      - name: Sign and notarize release app
        if: github.event_name == 'push' && github.ref_type == 'tag' && env.RELEASE_SIGNING_MODE == 'developer-id'
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          app="$RUNNER_TEMP/airport-monitor-build/Build/Products/Release/Airport Monitor.app"
          tools/release/resign-sparkle.sh "$app" "$AIRPORT_SIGNING_IDENTITY" "$AIRPORT_SIGNING_KEYCHAIN"
          tools/release/notarize-app.sh "$app" "$AIRPORT_NOTARY_KEY_PATH" "$APPLE_NOTARY_KEY_ID" "$APPLE_NOTARY_ISSUER_ID"

      - name: Package and verify app
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            export AIRPORT_RELEASE_SIGNING="$RELEASE_SIGNING_MODE"
          else
            export AIRPORT_RELEASE_SIGNING=adhoc AIRPORT_TEST_PACKAGE=1
          fi
          app="$RUNNER_TEMP/airport-monitor-build/Build/Products/Release/Airport Monitor.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          tag="v$version"
          if [[ "$EVENT_NAME" == push && "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          fi
          tools/release/package.sh "$app" "$tag" "$RUNNER_TEMP/airport-monitor-release"

      - name: Verify update feed with an isolated key
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: |
          app="$RUNNER_TEMP/airport-monitor-build/Build/Products/Release/Airport Monitor.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          tag="v$version"
          notes="$RUNNER_TEMP/airport-monitor-test-notes.md"
          printf 'Isolated update verification.\n' > "$notes"
          export SPARKLE_PRIVATE_KEY
          SPARKLE_PRIVATE_KEY=$(cat "$RUNNER_TEMP/airport-monitor-test-update-key")
          tools/release/prepare-appcast.sh "$app" "$RUNNER_TEMP/airport-monitor-release/Airport-Monitor-$tag-macOS-universal.zip" \
            "$tag" "$notes" "$RUNNER_TEMP/airport-monitor-release" "$RUNNER_TEMP/airport-monitor-packages/artifacts/sparkle/Sparkle/bin"

      - name: Verify invalid update signatures are rejected
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: |
          app="$RUNNER_TEMP/airport-monitor-build/Build/Products/Release/Airport Monitor.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          tools/release/test-appcast.sh "$app" "$RUNNER_TEMP/airport-monitor-release/Airport-Monitor-v$version-macOS-universal.zip" \
            "$RUNNER_TEMP/airport-monitor-test-notes.md" "$RUNNER_TEMP/airport-monitor-packages/artifacts/sparkle/Sparkle/bin" \
            "$RUNNER_TEMP/airport-monitor-test-update-key"

      - name: Verify release guards
        if: github.event_name != 'push' || github.ref_type != 'tag'
        run: |
          tools/release/test-release-guards.sh "$RUNNER_TEMP/airport-monitor-test-update-key" \
            "$RUNNER_TEMP/airport-monitor-packages/artifacts/sparkle/Sparkle/bin" \
            "$RUNNER_TEMP/airport-monitor-release/appcast.xml"

      - name: Prepare signed update feed
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          app="$RUNNER_TEMP/airport-monitor-build/Build/Products/Release/Airport Monitor.app"
          tools/release/prepare-appcast.sh "$app" "$RUNNER_TEMP/airport-monitor-release/Airport-Monitor-$RELEASE_TAG-macOS-universal.zip" \
            "$RELEASE_TAG" "$RUNNER_TEMP/airport-monitor-release/release-notes.md" "$RUNNER_TEMP/airport-monitor-release" \
            "$RUNNER_TEMP/airport-monitor-packages/artifacts/sparkle/Sparkle/bin"

      - name: Save release artifacts
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: airport-monitor-build
          path: ${{ runner.temp }}/airport-monitor-release/
          if-no-files-found: error
          retention-days: 14

      - name: Save validation-only artifacts
        if: github.event_name != 'push' || github.ref_type != 'tag'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: airport-monitor-validation-only
          path: ${{ runner.temp }}/airport-monitor-release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release draft
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: airport-monitor-build
          path: release

      - name: Verify checksum and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS.txt appcast.xml \
            --verify-tag --draft \
            --title "Airport Monitor $RELEASE_TAG" \
            --notes-file release-notes.md
