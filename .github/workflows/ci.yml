name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Test and build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Prepare release notes
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tools/release/prepare-notes.sh "$RELEASE_TAG" docs/releases \
            "$RUNNER_TEMP/airport-monitor-release/release-notes.md"

      - name: Run tests
        run: swift test --scratch-path "$RUNNER_TEMP/airport-monitor-tests"

      - name: Build universal app
        run: |
          xcodebuild -project AirportMonitor.xcodeproj \
            -scheme AirportMonitor -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/airport-monitor-build" \
            'ARCHS=arm64 x86_64' ONLY_ACTIVE_ARCH=NO build

      - name: Package and verify app
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          app="$RUNNER_TEMP/airport-monitor-build/Build/Products/Release/Airport Monitor.app"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          tag="v$version"
          if [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
          fi
          tools/release/package.sh "$app" "$tag" "$RUNNER_TEMP/airport-monitor-release"

      - name: Save build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: airport-monitor-build
          path: ${{ runner.temp }}/airport-monitor-release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create release draft
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: airport-monitor-build
          path: release

      - name: Verify checksum and create draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS.txt
          gh release create "$RELEASE_TAG" ./*.zip SHA256SUMS.txt \
            --verify-tag --draft \
            --title "Airport Monitor $RELEASE_TAG" \
            --notes-file release-notes.md
